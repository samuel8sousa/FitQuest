<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FitQuest - Evolução</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">

    <div class="logo">
        Fit<span>Quest</span>
    </div>


    <div class="user" id="nomeUsuario">

    </div>


</header>




<main class="evolution-page">


<section class="evolution-card card">


<div class="success-icon">

    ✓

</div>



<h1>
    Treino concluído!
</h1>



<p id="mensagem">

</p>





<div class="xp-earned">


<span>
    Experiência recebida
</span>


<strong id="xpGanho">

</strong>


</div>






<div class="level-update">


<div class="level-box">


<p>
    Nível atual
</p>


<h2 id="nivelAtual">
    
</h2>


</div>





<div class="arrow">

→

</div>





<div class="level-box">


<p>
    Próximo nível
</p>


<h2 id="proximoNivel">

</h2>


</div>



</div>






<div class="progress evolution-progress">

    <div 
    class="progress-value"
    id="barraNivel">
    </div>

</div>





<p id="xpProgresso"
class="progress-text">

</p>






<div class="reward">


🏅 
<span id="recompensa">

</span>


</div>





<button 
id="voltarDashboard"
class="btn-primary">

Voltar para Dashboard

</button>




</section>


</main>


<script src="evolution.js"></script>

</body>

</html>
