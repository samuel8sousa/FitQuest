<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitQuest - Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="login-container">


    <div class="login-card">


        <div class="logo">

            Fit<span>Quest</span>

        </div>


        <h1>
            Bem-vindo!
        </h1>


        <p>
            Torne o seu treino mais divertido e acompanhe sua evolução.
        </p>



        <form>


            <label>
                Matrícula
            </label>


            <input
            id="matricula"
            type="text"
            placeholder="Digite sua matrícula"
            >



            <label>
                Nome
            </label>


            <input
            id="nome"
            type="text"
            placeholder="Digite seu nome"
            >



            <button id="btnEntrar" type="button">

                Entrar

            </button>


        </form>



    </div>



</div>

<script src="script.js"></script>

</body>

</html>
